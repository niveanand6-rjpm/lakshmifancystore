<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lakshmi Bridal Jewellery - Rental Portal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f8f9fa;
      color: #333;
    }
    h1, h2 {
      color: #8b0000;
    }
    section {
      background: #ffffff;
      padding: 20px;
      margin-bottom: 25px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }
    input, select, button {
      width: 100%;
      max-width: 400px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      background-color: #d4af37;
      color: #fff;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background-color: #b89528;
    }
    .catalog-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }
    .catalog-card {
      border: 1px solid #e0e0e0;
      padding: 15px;
      border-radius: 8px;
      width: 220px;
      background: #fff;
      text-align: center;
    }
    .catalog-card img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 6px;
    }
    .badge-rented {
      background-color: #d9534f;
      color: #fff;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
    }
    .badge-available {
      background-color: #28a745;
      color: #fff;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <h1>Lakshmi Bridal Jewellery</h1>

  <!-- NEW BRIDAL JEWELLERY RENTAL ENTRY -->
  <section id="rental-entry">
    <h2>New Bridal Jewellery Rental Entry</h2>
    <form id="rentalForm">
      
      <div class="form-group">
        <label for="jewellerySelect">Select Jewellery Item:</label>
        <select id="jewellerySelect" onchange="updateRentalPrice()">
          <option value="">-- Select Item --</option>
        </select>
      </div>

      <div class="form-group">
        <label for="rentalPrice">Rental Price (₹):</label>
        <input type="number" id="rentalPrice" value="0" readonly />
      </div>

      <!-- DISCOUNT AMOUNT FIELD -->
      <div class="form-group">
        <label for="discountAmount">Discount Amount (₹):</label>
        <input 
          type="number" 
          id="discountAmount" 
          placeholder="0" 
          min="0" 
          oninput="calculateNetTotal()" 
        />
      </div>

      <!-- CALCULATED ACTUAL / NET PRICE FIELD -->
      <div class="form-group">
        <label for="netTotal">Net Total Amount (₹):</label>
        <input type="number" id="netTotal" value="0" readonly />
      </div>

      <div class="form-group">
        <label for="customerName">Customer Name:</label>
        <input type="text" id="customerName" required />
      </div>

      <div class="form-group">
        <label for="rentalDate">Rental Date:</label>
        <input type="date" id="rentalDate" required />
      </div>

      <button type="submit">Save Rental Entry</button>
    </form>
  </section>

  <!-- CATALOG & STATUS SECTION -->
  <section id="catalog-section">
    <h2>Jewellery Catalog & Status</h2>
    <div id="catalogGrid" class="catalog-grid">
      <p>Loading inventory...</p>
    </div>
  </section>

  <script>
    let inventoryData = [];

    // Fetch inventory JSON from data/inventory.json
    async function loadInventory() {
      try {
        const response = await fetch('data/inventory.json');
        if (!response.ok) throw new Error('Could not load data/inventory.json');
        inventoryData = await response.json();
        
        populateDropdown();
        renderCatalog();
      } catch (error) {
        console.error("Error loading inventory:", error);
        document.getElementById('catalogGrid').innerHTML = '<p style="color:red;">Failed to load data/inventory.json. Please check if the file exists inside the data folder.</p>';
      }
    }

    // Populate item selection dropdown
    function populateDropdown() {
      const select = document.getElementById('jewellerySelect');
      if (!select) return;

      select.innerHTML = '<option value="">-- Select Item --</option>';
      inventoryData.forEach(item => {
        const option = document.createElement('option');
        option.value = item.id;
        const price = item.rentalPrice !== undefined ? item.rentalPrice : (item.price || 0);
        option.setAttribute('data-price', price);
        option.textContent = `${item.id} - ${item.name}`;
        select.appendChild(option);
      });
    }

    // Auto-populate Rental Price when dropdown selection changes
    function updateRentalPrice() {
      const select = document.getElementById('jewellerySelect');
      const selectedOption = select.options[select.selectedIndex];
      const price = selectedOption ? parseFloat(selectedOption.getAttribute('data-price')) || 0 : 0;

      document.getElementById('rentalPrice').value = price;
      calculateNetTotal();
    }

    // Calculate Net Price = (Rental Price - Discount Amount)
    function calculateNetTotal() {
      const rentalPrice = parseFloat(document.getElementById('rentalPrice').value) || 0;
      let discountAmount = parseFloat(document.getElementById('discountAmount').value) || 0;

      if (discountAmount < 0) {
        discountAmount = 0;
        document.getElementById('discountAmount').value = 0;
      }

      if (discountAmount > rentalPrice) {
        discountAmount = rentalPrice;
        document.getElementById('discountAmount').value = rentalPrice;
      }

      const netTotal = rentalPrice - discountAmount;
      document.getElementById('netTotal').value = netTotal.toFixed(2);
    }

    // Render Catalog Grid
    function renderCatalog() {
      const grid = document.getElementById('catalogGrid');
      if (!grid) return;

      if (!inventoryData || inventoryData.length === 0) {
        grid.innerHTML = '<p>No items found in catalog.</p>';
        return;
      }

      grid.innerHTML = inventoryData.map(item => {
        const isRented = String(item.status).toUpperCase() === 'RENTED';
        const price = item.rentalPrice !== undefined ? item.rentalPrice : (item.price || 0);

        return `
          <div class="catalog-card">
            <img src="${item.imageUrl || 'images/placeholder.jpg'}" alt="${item.name}" />
            <h3>${item.name}</h3>
            <p><strong>Code:</strong> ${item.id}</p>
            <p><strong>Price:</strong> ₹${price}</p>
            <p>
              ${isRented ? '<span class="badge-rented">Rented</span>' : '<span class="badge-available">Available</span>'}
            </p>
          </div>
        `;
      }).join('');
    }

    // Form submit handler
    document.getElementById('rentalForm').addEventListener('submit', function(event) {
      event.preventDefault();

      const selectedId = document.getElementById('jewellerySelect').value;
      const rentalPrice = document.getElementById('rentalPrice').value;
      const discountAmount = document.getElementById('discountAmount').value || 0;
      const netTotal = document.getElementById('netTotal').value;

      if (!selectedId) {
        alert('Please select a jewellery item.');
        return;
      }

      alert(`Rental Entry Saved!\nOriginal Price: ₹${rentalPrice}\nDiscount: ₹${discountAmount}\nNet Total Amount: ₹${netTotal}`);
      this.reset();
      calculateNetTotal();
    });

    // Run on initial load
    document.addEventListener('DOMContentLoaded', loadInventory);
  </script>
</body>
</html>
